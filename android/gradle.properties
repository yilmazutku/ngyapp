# R8/D8 ve Kotlin derlemesi icin yeterli bellek (release build R8 asamasinda
# 2 GB ile sinirda kaliyordu).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
# android.enableJetifier kaldirildi: eski android.support kutuphanelerine
# bagimlilik yok, AGP 8'de kullanimdan kaldirildi ve build'i yavaslatiyordu.
